<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>BIMteam — подбор подрядчиков</title><link rel="stylesheet" href="/web/styles.css"></head>
<body><main>
<p>BIMteam · HackAlem</p><h1>Подрядчики для вашего мероприятия</h1>
<p>До трёх вариантов с объяснениями. Цена «от» не является окончательной сметой.</p>
<form id="search">
<label>Город<select name="city" required></select></label>
<label>Категория<select name="category" required></select></label>
<label>Формат<select name="event_format" required></select></label>
<label>Дата<input name="date" type="date" value="2026-10-10" min="2026-09-23" max="2026-12-31" required></label>
<label>Бюджет, ₸<input name="budget" type="number" min="0" max="1000000000" step="1" value="1000000" required></label>
<label>Длительность, ч (необязательно)<input name="duration_hours" type="number" min="0.5" max="100" step="0.5"></label>
<label>Язык (необязательно)<select name="language"><option value="">Не важен</option></select></label>
<button disabled>Подобрать</button>
</form><p id="status" role="status" aria-live="polite">Загрузка каталога…</p><section id="results" aria-label="Подрядчики"></section>
</main><script src="/web/app.js" defer></script></body></html>
